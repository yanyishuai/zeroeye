openapi: 3.1.0
info:
  title: Diff Fixture
  version: 1.0.0
paths:
  /users:
    get:
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: OK
      tags:
        - Public
        - Users
components:
  schemas:
    User:
      required:
        - name
        - id
      properties:
        email:
          type: string
        name:
          type: string
        id:
          type: string
      type: object
